name: CI & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Go Vet & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Ebiten Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -v ./...

  build:
    name: Build (${{ matrix.name }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - name: macos-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
          - name: macos-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Ebiten Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/soundcheck-${{ matrix.name }}${{ matrix.ext }}" ./cmd/game

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          tar -czf "soundcheck-${{ matrix.name }}.tar.gz" -C dist "soundcheck-${{ matrix.name }}${{ matrix.ext }}"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/soundcheck-${{ matrix.name }}${{ matrix.ext }}" -DestinationPath "soundcheck-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            soundcheck-${{ matrix.name }}.tar.gz
            soundcheck-${{ matrix.name }}.zip
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
